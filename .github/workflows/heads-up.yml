name: heads-up

on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: heads-up
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.HEADS_UP_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "heads-up-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then git commit -q -m "state" && git push -q; fi
